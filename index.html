<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>

    <!-- Tailwind -->
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
      <style>
        *{
            box-sizing: border-box;
        }
       :root{
            --player1-color: #881600;
            --btn-bckgrd-color: #ced4da;

       }

      </style>

</head>
<body class="max-w-4xl mx-auto h-screen bg-[#8b915e] text-center pt-15">
    <main class="main-container ">
        <h1 class="hero-heading h-3/4 mb-14 text-5xl font-extrabold text-[#22333b]">Tic <span class="text-(--player1-color)">Tac</span> <span class="text-[#bf4e30] ">Toe</span></h1>

        <div class="game-container mt-20 grid grid-cols-3 gap-6">
            <button class="box bg-(--btn-bckgrd-color) text-(--player1-color) h-[18vmin] rounded-xl shadow text-[15vmin] flex justify-center items-center "></button>
            <button class="box bg-(--btn-bckgrd-color) text-(--player1-color) h-[18vmin] rounded-xl shadow text-[15vmin] flex justify-center items-center "></button>
            <button class="box bg-(--btn-bckgrd-color) text-(--player1-color) h-[18vmin] rounded-xl shadow text-[15vmin] flex justify-center items-center "></button>
            <button class="box bg-(--btn-bckgrd-color) text-(--player1-color) h-[18vmin] rounded-xl shadow text-[15vmin] flex justify-center items-center "></button>
            <button class="box bg-(--btn-bckgrd-color) text-(--player1-color) h-[18vmin] rounded-xl shadow text-[15vmin] flex justify-center items-center "></button>
            <button class="box bg-(--btn-bckgrd-color) text-(--player1-color) h-[18vmin] rounded-xl shadow text-[15vmin] flex justify-center items-center "></button>
            <button class="box bg-(--btn-bckgrd-color) text-(--player1-color) h-[18vmin] rounded-xl shadow text-[15vmin] flex justify-center items-center "></button>
            <button class="box bg-(--btn-bckgrd-color) text-(--player1-color) h-[18vmin] rounded-xl shadow text-[15vmin] flex justify-center items-center "></button>
            <button class="box bg-(--btn-bckgrd-color) text-(--player1-color) h-[18vmin] rounded-xl shadow text-[15vmin] flex justify-center items-center "></button>
        </div>

        <button id="reset-btn" class="bg-[#191913] font-bold text-2xl p-4 rounded-2xl text-center text-white mt-20">Reset Game</button>
    </main>

</body>
</html>
